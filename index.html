<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2c3e50, #1a242f);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor-login {
            background: #34495e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #f1c40f;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #ecf0f1;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #2c3e50;
            color: #ecf0f1;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
            font-weight: 600;
        }

        button:hover {
            background: #2980b9;
        }

        #mensaje {
            margin-top: 20px;
            color: #e74c3c;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="contenedor-login">
        <h2>Ingreso de Administradores</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Acceder</button>
        </form>
        
        <p id="mensaje"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        
        // ⚠️ CONFIGURACIÓN DE FIREBASE: UTILIZA LA MISMA QUE EN TODOS TUS ARCHIVOS
        const firebaseConfig = {
            apiKey: "AIzaSyDY5KBUwbDwjeCYY7ILXkRB5EJBVoVAmF0", 
            authDomain: "talonario-rifa.firebaseapp.com",
            projectId: "talonario-rifa",
            storageBucket: "talonario-rifa.appspot.com",
            messagingSenderId: "987446023081",
            appId: "1:987446023081:web:150e8d7a94975593ac2ab8",
            measurementId: "G-FWH8F9SVFM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const mensaje = document.getElementById('mensaje');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = emailInput.value;
            const password = passwordInput.value;
            mensaje.textContent = 'Iniciando sesión...';
            
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Si el login es exitoso, Firebase establece la sesión.
                    // Ahora redirigimos al panel de administración.
                    mensaje.style.color = '#2ecc71';
                    mensaje.textContent = '¡Acceso exitoso! Verificando permisos...';
                    
                    // IMPORTANTE: Redirige a la página principal de la app de admin (que será admin.html)
                    window.location.href = 'admin.html';
                })
                .catch((error) => {
                    // Si falla el login (ej. credenciales incorrectas)
                    mensaje.style.color = '#e74c3c';
                    let errorMsg = 'Error de inicio de sesión. Revisa email y contraseña.';
                    if (error.code === 'auth/user-not-found') {
                        errorMsg = 'Usuario no encontrado.';
                    } else if (error.code === 'auth/wrong-password') {
                        errorMsg = 'Contraseña incorrecta.';
                    }
                    mensaje.textContent = errorMsg;
                    console.error("Error de login:", error.code, error.message);
                });
        });

        // 💡 NOTA: La verificación de si es ADMIN se hace en 'admin.html'. 
        // Si el usuario no es admin, 'admin.html' lo bloqueará y cerrará la sesión.

    </script>
</body>
</html>
